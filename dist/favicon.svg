<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <!-- Dark Background Squircle -->
  <rect width="100" height="100" rx="26" fill="#09090b" />
  
  <!-- Gradient Outer Rim -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-opacity="0.85" />
  
  <!-- Serif "M" Monogram -->
  <text x="50" y="67" font-family="'Merriweather', Georgia, serif" font-size="54" font-weight="bold" fill="url(#brandGrad)" text-anchor="middle">
    M
  </text>
</svg>
